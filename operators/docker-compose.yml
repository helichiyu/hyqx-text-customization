# 文本定制化生产 · 11 个算子合并为单容器（服务名 op-custom-text，对外端口 17022）
#
# 本文件是交付包 release/op-custom-text-docker/ 内的编排文件，由
#   python -I operators/_shared_tools/pack_docker_bundle.py
# 原样复制过去；仓库根直接 `docker compose up` 没有构建上下文，请先生成交付包。
#
# 用法（交付包目录）：
#   docker compose up -d --build
#   curl http://127.0.0.1:17022/healthz
#   curl http://127.0.0.1:17022/meta_clean_slice/healthz
#
# 路由：/<算子名>/<接口>，例如
#   POST /meta_clean_slice/predict
#   POST /img_struct_describe/uploadFile?uniqueId=...
# 11 个算子在容器内各自独立进程运行，nginx 按路径前缀分流。
#
# 共享数据卷：./op-runtime 挂载到容器 /data（INPUT_DIR=/data/input、OUTPUT_DIR=/data/outputs）。
# 模型调用默认走硅基流动公网 API，宿主机需可出网；如需覆盖网关/密钥，取消下面注释。
# 11 服务独立端口形态见 docker-compose.per-port.yml。

name: op-custom-text

services:
  op-custom-text:
    # 显式指定镜像名，否则 Compose 会按 {项目名}-{服务名} 自动命名成 op-custom-text-op-custom-text
    image: op-custom-text:latest
    build: ./op-custom-text
    container_name: op-custom-text
    restart: unless-stopped
    ports:
      - "17022:17022"
    environment:
      INPUT_DIR: /data/input
      OUTPUT_DIR: /data/outputs
      # SILICONFLOW_BASE_URL: http://your-gateway/v1
      # SILICONFLOW_API_KEY: sk-...
    volumes:
      - ./op-runtime:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:17022/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
