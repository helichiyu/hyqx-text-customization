# 文本定制化生产 · 11 个算子服务一键编排（每算子独立容器/端口）
#
# 单容器合并形态（服务名 op-custom-text、端口 17022）见 docker-compose.yml。
#
# 用法（在 release 目录，即本文件所在目录，先解压全部 <tag>.zip 到同名目录）：
#   for f in *.zip; do unzip -q "$f" -d "${f%.zip}"; done
#   docker compose up -d --build
#
# 共享数据卷：./op-runtime 挂载到所有容器的 /data（INPUT_DIR=/data/input、OUTPUT_DIR=/data/outputs）。
# 链路传输要求下游能读到上游的 outputFile——所有容器共用同一挂载路径即可满足路径闸门校验。
# （本形态供本地联调；平台交付用单容器形态 docker-compose.yml，不挂载任何卷。）
# 模型调用默认走 IDG/磐智网关（MODEL_PROVIDER=idg），凭据用环境变量注入：
# 本地联调在 operators/.env 配 MODEL_APP_KEY；回退第三方置 MODEL_PROVIDER=siliconflow + SILICONFLOW_API_KEY。

x-op-common: &op-common
  restart: unless-stopped
  environment: &op-env
    INPUT_DIR: /data/input
    OUTPUT_DIR: /data/outputs
    # MODEL_PROVIDER: idg            # 默认即 idg；回退改 siliconflow 并配 SILICONFLOW_API_KEY
    # MODEL_APP_KEY: <磐智 APPKEY>   # 联调值见 docs/参考记录/聊天记录.txt；生产建议 Secret
    # AUTH_TOKEN_SHA256: <令牌摘要>  # 平台未配 X-Token 前保持注释（认证自动关闭）
  volumes:
    - ./op-runtime:/data
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:6288/healthz', timeout=3).status==200 else 1)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s

services:

  meta-clean-slice:
    <<: *op-common
    build: ./meta_clean_slice
    container_name: op-meta-clean-slice
    ports: ["6301:6288"]

  meta-genre-judge:
    <<: *op-common
    build: ./meta_genre_judge
    container_name: op-meta-genre-judge
    ports: ["6302:6288"]

  meta-fact-extract:
    <<: *op-common
    build: ./meta_fact_extract
    container_name: op-meta-fact-extract
    ports: ["6303:6288"]

  meta-field-fill:
    <<: *op-common
    build: ./meta_field_fill
    container_name: op-meta-field-fill
    ports: ["6304:6288"]

  lay-page-render:
    <<: *op-common
    build: ./lay_page_render
    container_name: op-lay-page-render
    ports: ["6305:6288"]

  lay-page-detect:
    <<: *op-common
    build: ./lay_page_detect
    container_name: op-lay-page-detect
    ports: ["6306:6288"]

  fml-formula-locate:
    <<: *op-common
    build: ./fml_formula_locate
    container_name: op-fml-formula-locate
    ports: ["6307:6288"]

  fml-formula-recognize:
    <<: *op-common
    build: ./fml_formula_recognize
    container_name: op-fml-formula-recognize
    ports: ["6308:6288"]

  img-region-locate:
    <<: *op-common
    build: ./img_region_locate
    container_name: op-img-region-locate
    ports: ["6309:6288"]

  img-type-classify:
    <<: *op-common
    build: ./img_type_classify
    container_name: op-img-type-classify
    ports: ["6310:6288"]

  img-struct-describe:
    <<: *op-common
    build: ./img_struct_describe
    container_name: op-img-struct-describe
    ports: ["6311:6288"]
