# op-custom-text 单容器入口：按 /<算子名>/ 前缀路由到 11 个本地 uvicorn 进程。
# 对外只暴露 17022；每个算子进程只监听 127.0.0.1:7101-7111。
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # 上传 zip 单包上限由算子侧控制（默认 2 GB），nginx 不做二次限制。
    client_max_body_size 0;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $uri $backend_port {
        ~^/meta_clean_slice/      7101;
        ~^/meta_genre_judge/      7102;
        ~^/meta_fact_extract/     7103;
        ~^/meta_field_fill/       7104;
        ~^/lay_page_render/       7105;
        ~^/lay_page_detect/       7106;
        ~^/fml_formula_locate/    7107;
        ~^/fml_formula_recognize/ 7108;
        ~^/img_region_locate/     7109;
        ~^/img_type_classify/     7110;
        ~^/img_struct_describe/   7111;
        default                   "";
    }

    server {
        listen 17022;
        server_name _;

        # 容器健康检查：supervisor 确认 11 个算子就绪后才启动 nginx。
        location = /healthz {
            default_type application/json;
            return 200 '{"code":0,"msg":"success","data":{"status":"ready","service":"op-custom-text"}}';
        }

        location = / {
            default_type application/json;
            return 200 '{"code":0,"msg":"success","data":{"service":"op-custom-text","route":"/<operator>/<api>","port":17022}}';
        }

        location ~ ^/(?<op>meta_clean_slice|meta_genre_judge|meta_fact_extract|meta_field_fill|lay_page_render|lay_page_detect|fml_formula_locate|fml_formula_recognize|img_region_locate|img_type_classify|img_struct_describe)(?<rest>/.*)$ {
            if ($backend_port = "") {
                return 404;
            }

            # 去掉 /<算子名> 前缀后转发：/meta_clean_slice/predict -> 127.0.0.1:7101/predict
            proxy_pass http://127.0.0.1:$backend_port$rest$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # /predict 平台侧超时 1800s，这里留出余量。
            proxy_connect_timeout 60s;
            proxy_send_timeout 1900s;
            proxy_read_timeout 1900s;

            # 大 zip 直接流式转发，避免 nginx 落临时文件。
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
