# 预训练文本算子池（联调部署）——骨架参照 demo 的 compose，三处调整：
# ① 外部端口 17014（测试方要求）；② 去掉 workspace 卷（本池无状态，demo 的
#    卷是其有状态设计遗留）；③ 多 worker gunicorn（规范 11.2，见 Dockerfile CMD）
name: op-pretrain-text-pool

services:
  op-pretrain-text-pool:
    build:
      context: .
      dockerfile: Dockerfile
    image: op-pretrain-text-pool:1.0.0
    container_name: op-pretrain-text-pool
    restart: unless-stopped
    ports:
      - "17014:17014"
    environment:
      - WORKERS=4
      - MAX_INPUT_MB=10
      - MAX_RESPONSE_MB=50
      # 认证拦截（规范 3.4）：联调用明文变量便于测试方取值，调用方请求头带
      # X-Token: pretrain-text-pool-dev。生产/K8S 改用 AUTH_TOKEN_SHA256
      # （只注入摘要）+ Secret，并删除本行明文
      - AUTH_TOKEN=pretrain-text-pool-dev
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:17014/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
