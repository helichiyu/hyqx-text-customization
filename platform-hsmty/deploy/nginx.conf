server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Web 容器只托管静态资源；/hs-api 由 Ingress/网关直接转发到 tcs-server
    location = / {
        return 302 /sdom-hsmty/;
    }

    location /sdom-hsmty/ {
        try_files $uri $uri/ /sdom-hsmty/index.html;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
